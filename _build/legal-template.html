<!DOCTYPE html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{canonical}}" />
{{alternates}}    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        --bg: #f6f4f3;
        --card: #ffffff;
        --soft: #f1ece9;
        --fg: #1c1c1c;
        --muted: #5c5a58;
        --line: #e4ddd8;
        --accent: #956424;
        --accent-strong: #f1a23b;
        --accent-soft: #fbf0ec;
        --on-accent: #2f3131;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2f3131;
          --card: #393a3a;
          --soft: #434545;
          --fg: #e7e7e7;
          --muted: #b9baba;
          --line: #4d4f4f;
          --accent: #f1a23b;
          --accent-strong: #f1a23b;
          --accent-soft: #3a2a18;
          --on-accent: #2f3131;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      }
      a { color: var(--accent); text-underline-offset: 3px; }
      .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }

      nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; gap: 16px; }
      .brand { display: flex; flex-shrink: 0; white-space: nowrap; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--fg); text-decoration: none; }
      .brand img { width: 32px; height: 32px; border-radius: 8px; }
      .nav-links { display: flex; gap: 20px; font-size: 15px; align-items: center; }
      .nav-links a { color: var(--muted); text-decoration: none; white-space: nowrap; }
      .nav-links a:hover, .nav-links a[aria-current] { color: var(--fg); }
      .button { display: inline-block; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 600; font-size: 15px; background: var(--card); }
      .nav-links a.button { color: var(--fg); }

      main.prose { margin: 0; padding: 24px 0 56px; overflow-wrap: anywhere; }
      .prose h1 { font-size: 36px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 8px; }
      .prose h2 { font-size: 21px; line-height: 1.3; letter-spacing: -0.01em; margin: 36px 0 8px; padding-top: 20px; border-top: 1px solid var(--line); scroll-margin-top: 16px; }
      .prose h3 { font-size: 17px; line-height: 1.35; margin: 24px 0 6px; }
      .prose ul, .prose ol { padding-left: 1.25em; }
      .prose li + li { margin-top: 8px; }
      .prose .muted { color: var(--muted); margin-top: 0; }
      .note { background: var(--accent-soft); border-radius: 12px; padding: 12px 16px; font-size: 15px; margin: 16px 0; }
      .toc { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 20px; margin: 24px 0 8px; }
      .toc summary { cursor: pointer; font-weight: 600; padding: 12px 0; list-style: none; display: flex; justify-content: space-between; }
      .toc summary::-webkit-details-marker { display: none; }
      .toc summary::after { content: '+'; color: var(--accent); font-weight: 400; font-size: 20px; line-height: 1; }
      .toc[open] summary::after { content: '−'; }
      .toc ol { margin: 0 0 14px; padding-left: 1.4em; columns: 2; column-gap: 32px; font-size: 15px; }
      .toc li { break-inside: avoid; margin: 0 0 6px; }
      .toc li + li { margin-top: 0; }
      .toc a { text-decoration: none; }
      .toc a:hover { text-decoration: underline; }
      .prose table { width: 100%; border-collapse: collapse; font-size: 15px; }
      .prose th, .prose td { text-align: left; vertical-align: top; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); }
      .prose th { color: var(--muted); font-weight: 600; }
      .table-scroll { overflow-x: auto; }

      footer { padding: 24px 0 40px; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; border-top: 1px solid var(--line); }
      footer .links { display: flex; flex-wrap: wrap; column-gap: 20px; }
      footer a { color: var(--muted); display: inline-flex; align-items: center; min-height: 44px; }
      footer a[aria-current] { color: var(--fg); }
      .lang { display: flex; gap: 4px; font-size: 13px; }
      .lang a { color: var(--muted); text-decoration: none; padding: 2px 6px; border-radius: 6px; min-height: 32px; }
      .lang a[aria-current] { color: var(--fg); font-weight: 700; background: var(--soft); }
      footer .lang { width: 100%; flex-wrap: wrap; }

      @media (max-width: 1000px) {
        .nav-links .lang { display: none; }
      }
      @media (max-width: 720px) {
        nav { padding: 14px 0; }
        .nav-links .text { display: none; }
        .prose h1 { font-size: 28px; }
        .toc ol { columns: 1; }
      }
      @media print {
        nav, footer, .toc { display: none; }
        a { color: inherit; }
      }
    </style>
{{redirect}}  </head>
  <body>
    <div class="wrap">
      <nav>
        <a class="brand" href="{{home}}"><img src="/apple-touch-icon.png" alt="" />Mind Hub</a>
        <div class="nav-links">
          <a class="text" href="{{privacyUrl}}"{{privacyCurrent}}>{{privacyLabel}}</a>
          <a class="text" href="{{termsUrl}}"{{termsCurrent}}>{{termsLabel}}</a>
          <a class="button" href="{{home}}#support">{{helpLabel}}</a>
          {{switcher}}
        </div>
      </nav>
      <main class="prose">
{{content}}
      </main>
      <footer>
        <div>© 2026 Mind Hub</div>
        <div class="links">
          <a href="{{privacyUrl}}"{{privacyCurrent}}>{{privacyLabel}}</a>
          <a href="{{termsUrl}}"{{termsCurrent}}>{{termsLabel}}</a>
          <a href="{{home}}#delete-account">{{deleteLabel}}</a>
          <a href="mailto:support@mymindhub.app">{{contactLabel}}</a>
        </div>
        {{switcher}}
      </footer>
    </div>
{{remember}}  </body>
</html>
